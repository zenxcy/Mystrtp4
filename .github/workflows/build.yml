name: build mystrtp
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -q mystrtp.zip
      - run: mvn -B clean package
        working-directory: mystrtp
      - uses: actions/upload-artifact@v4
        with:
          name: mystrtp
          path: mystrtp/target/mystrtp.jar
